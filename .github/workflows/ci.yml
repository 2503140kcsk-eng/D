name: Lean CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          leanchecker: true
          leanchecker-args: "HakuiKoyori.Number HakuiKoyori.ExperimentalHierarchy"
          axiom-audit: true
          axiom-audit-root: HakuiKoyori
